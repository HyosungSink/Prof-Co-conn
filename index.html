  <main id="top" class="container">

      <div class="hero-copy">
        <div class="period"><span></span> 2023.01.01 – 2026.11.12</div>
        <h1 id="page-title">AI 研究 <em>Connection</em></h1>
        <p>从共同发表的论文追溯高校教师、企业研究人员和参与企业科研的在读学生。</p>
        <div class="stats" aria-label="调查统计">
          <div><strong id="confirmed-count">—</strong><span>已确认关系</span></div>
          <div><strong id="company-count">—</strong><span>企业</span></div>
          <div><strong id="school-count">—</strong><span>范围内高校</span></div>
        </div>

        </div>
        <div id="company-plot" class="company-plot"></div>
      </section>
    </section>
    <section class="school-distribution" aria-labelledby="school-plot-title">
      <div class="school-chart-head">
        <div class="school-chart-title">

        </div>
      </div>
      <div id="school-plot" class="school-plot"></div>
      <div id="school-zero" class="school-zero" hidden></div>
      <p id="school-chart-note" class="school-chart-note">面积表示归属该校的已确认关系数；占比以图中关系统计。点击高校查看论文。</p>
    </section>
