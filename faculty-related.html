      <nav class="faculty-directory-nav" aria-label="教师名录页面">

      <form id="faculty-filters" class="filters faculty-filters" role="search" aria-label="筛选教师名录">
        <label class="search"><span>搜索</span><input id="faculty-query" type="search" placeholder="教师姓名、职称或所属单位"></label>
        <label><span id="faculty-school-label">高校</span><select id="faculty-school" aria-labelledby="faculty-school-label"><option value="">全部高校</option></select></label>
        <label><span id="faculty-department-label">院系</span><select id="faculty-department" aria-labelledby="faculty-department-label" disabled><option value="">请先选择高校</option></select></label>
        <label><span>职称</span><select id="faculty-title-filter"><option value="">全部职称</option></select></label>
        <label><span>核验情况</span><select id="faculty-verification-filter">
          <option value="">全部</option><option value="3">三项齐全</option>
          <option value="checked">三项已核查（暂无学术主页）</option><option value="2">已核实 2 项</option>
          <option value="1">已核实 1 项</option><option value="0">尚无已核实项</option>
        </select></label>
        <label><span>论文关系</span><select id="faculty-paper-audit-filter">
          <option value="">全部</option><option value="eligible">本轮调查范围</option>
          <option value="complete">已梳理</option><option value="partial">梳理中</option>
          <option value="unstarted">未开始</option>
        </select></label>
      </form>
      <div class="result-bar"><p id="faculty-count" aria-live="polite"></p></div>
      <div id="faculty-rosters" class="faculty-rosters"></div>
      <noscript><p class="empty">请启用 JavaScript 以浏览教师名录。</p></noscript>
