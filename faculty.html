<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按高校和院系查阅 26 所调查高校公开的计算机相关教师名录。">
  <title>教师名录 · AI 研究 Connection</title>
  <link rel="stylesheet" href="styles.css?v=5498b166401a">
  <script src="data.js?v=5498b166401a" defer></script>
  <script src="ui.js?v=5498b166401a" defer></script>
  <script src="faculty-data.js?v=5498b166401a" defer></script>
  <script src="faculty-titles.js?v=5498b166401a" defer></script>
  <script src="faculty-rosters.js?v=5498b166401a" defer></script>
  <script src="faculty-page.js?v=5498b166401a" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="wordmark" href="index.html"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> Connection</a>
      <nav aria-label="页面导航">
        <a href="connections.html">关系索引</a>
        <a href="leads.html">合著线索</a>
        <a href="faculty.html" aria-current="page">教师名录</a>
        <a href="method.html">核验口径</a>
      </nav>
    </div>
  </header>
  <main class="container standalone faculty-page">
    <section class="main-section" aria-labelledby="faculty-title">
      <div class="section-head"><div><h1 id="faculty-title">教师名录</h1><p>按高校查阅计算机、人工智能、网络安全、软件工程、数据科学及相关院系的公开师资名单。</p></div></div>
      <p class="faculty-scope-note">同一人在同一院系只列一次。职称与导师、双聘、兼职等任职信息分别列出；只查到职称层级时标为「职称层级」，缺少公开依据时标为「待核实」。</p>
      <form id="faculty-filters" class="filters faculty-filters" role="search" aria-label="筛选教师名录">
        <label class="search"><span>搜索</span><input id="faculty-query" type="search" placeholder="教师姓名、职称或院系"></label>
        <label><span id="faculty-school-label">高校</span><select id="faculty-school" aria-labelledby="faculty-school-label"><option value="">全部高校</option></select></label>
        <label><span id="faculty-department-label">院系</span><select id="faculty-department" aria-labelledby="faculty-department-label" disabled><option value="">请先选择高校</option></select></label>
      </form>
      <section id="faculty-distribution" class="hero-plot faculty-distribution" aria-labelledby="faculty-plot-title" hidden>
        <div class="plot-head">
          <h2 id="faculty-plot-title">高校教师名录分布</h2>
          <span class="legend"><span><i aria-hidden="true"></i><span id="faculty-plot-scale"></span></span></span>
        </div>
        <div id="faculty-plot" class="faculty-plot"></div>
      </section>
      <div class="result-bar"><p id="faculty-count" aria-live="polite" tabindex="-1"></p></div>
      <div id="faculty-rosters" class="faculty-rosters"></div>
      <noscript><p class="empty">请启用 JavaScript 以浏览教师名录。</p></noscript>
    </section>
  </main>
  <footer class="container footer"><a class="wordmark" href="index.html"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> Connection</a><span>教师任职以院系官网为准</span></footer>
</body>
</html>
